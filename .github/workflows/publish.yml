name: Publish to pub.dev

## Caller of this workflow should use it as follows:
##
## jobs:
##   publish:
##     permissions:
##       id-token: write # Required for OIDC token minting
##     uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
##     # with:
##     #   working-directory: path/to/sub/directory # Or pkgs/{package}, or omit to auto-discover from <package>-v<version> tags
##     #   sdk: stable
##     #   use-flutter: false

on:
  workflow_call:
    inputs:
      environment:
        description: If specified, the workflow is required to be run in this environment (with additional approvals).
        required: false
        type: string
      working-directory:
        description: >-
          The directory within the repository where the package is located.
          Supports '{package}' placeholder expansion from '<package>-v<version>'
          tags (for example, 'pkgs/{package}'). When omitted or '.', uses a
          publishable root pubspec.yaml if present, or otherwise locates the
          publishable package matching '<package>' from a '<package>-v<version>'
          tag.
        required: false
        default: '.'
        type: string
      sdk:
        description: >-
          The Dart SDK channel ('stable', 'beta', 'dev'), release version
          ('3.13'), or specific version ('3.14.0-286.0.dev') to install.
        required: false
        default: 'stable'
        type: string
      use-flutter:
        description: Whether to install the Flutter SDK in addition to the Dart SDK.
        required: false
        default: true
        type: boolean
      test-run:
        description: Whether to verify the package archive instead of publishing to pub.dev.
        required: false
        default: false
        type: boolean

jobs:
  validate:
    name: 'Validate package'
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      working-directory: ${{ steps.resolve-dir.outputs.directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve package directory
        id: resolve-dir
        env:
          INPUT_DIR: ${{ inputs.working-directory }}
          REF_NAME: ${{ github.ref_name }}
          TEST_RUN: ${{ inputs.test-run }}
        run: |
          python3 - << 'EOF'
          import os
          import re
          import sys

          try:
              import yaml
          except ImportError:
              yaml = None

          TAG_RE = re.compile(r"^([a-z0-9_]+)-v([0-9]+\.[0-9]+\.[0-9]+.*)$")


          def load_pubspec(path, strict=False):
              try:
                  with open(path, encoding="utf-8") as f:
                      text = f.read()
              except (OSError, UnicodeDecodeError) as e:
                  if strict:
                      sys.exit(f"Error: Failed to read '{path}': {e}")
                  return None

              if yaml is not None:
                  try:
                      data = yaml.load(text, Loader=yaml.BaseLoader)
                      return data if isinstance(data, dict) else {}
                  except yaml.YAMLError as e:
                      if strict:
                          sys.exit(f"Error: Failed to parse '{path}': {e}")
                      return None

              result = {}
              for line in text.splitlines():
                  m = re.match(r"^(name|publish_to)\s*:\s*(.+?)\s*$", line)
                  if m:
                      key, val = m.group(1), m.group(2)
                      if " #" in val:
                          val = val.split(" #", 1)[0].strip()
                      if len(val) >= 2 and val[0] == val[-1] and val[0] in ("'", '"'):
                          val = val[1:-1]
                      result[key] = val
              return result


          def validate_rel_dir(d):
              norm = os.path.normpath(d)
              if os.path.isabs(norm) or norm == ".." or norm.startswith(".." + os.sep):
                  sys.exit(
                      f"Error: working-directory '{d}' must stay within the repository."
                  )
              return norm


          raw_dir = os.environ.get("INPUT_DIR", ".").strip() or "."
          ref_name = os.environ.get("REF_NAME", "").strip()
          test_run = os.environ.get("TEST_RUN", "false").strip().lower() == "true"

          if "{package}" in raw_dir:
              m = TAG_RE.match(ref_name)
              if not m:
                  sys.exit(
                      f"Error: Cannot expand '{{package}}' in working-directory "
                      f"'{raw_dir}': ref '{ref_name}' does not match "
                      f"'<package>-v<version>'."
                  )
              pkg_name = m.group(1)
              resolved = validate_rel_dir(raw_dir.replace("{package}", pkg_name))
              pubspec_path = os.path.join(resolved, "pubspec.yaml")
              if not os.path.isfile(pubspec_path):
                  sys.exit(f"Error: No pubspec.yaml found at '{pubspec_path}'.")
              pubspec = load_pubspec(pubspec_path, strict=True)
              actual_name = pubspec.get("name")
              if actual_name != pkg_name:
                  sys.exit(
                      f"Error: Package name in '{pubspec_path}' is '{actual_name}', "
                      f"expected '{pkg_name}' from tag '{ref_name}'."
                  )
              if pubspec.get("publish_to") == "none":
                  sys.exit(
                      f"Error: Package '{pkg_name}' at '{resolved}' has "
                      f"'publish_to: none' and cannot be published."
                  )
          else:
              norm_dir = validate_rel_dir(raw_dir)
              if norm_dir != ".":
                  resolved = norm_dir
                  pubspec_path = os.path.join(resolved, "pubspec.yaml")
                  if not os.path.isfile(pubspec_path):
                      sys.exit(f"Error: No pubspec.yaml found at '{pubspec_path}'.")
                  pubspec = load_pubspec(pubspec_path, strict=True)
                  if not test_run and pubspec.get("publish_to") == "none":
                      sys.exit(
                          f"Error: Package at '{resolved}' has 'publish_to: none' "
                          f"and cannot be published."
                      )
              else:
                  root_has_pubspec = os.path.isfile("pubspec.yaml")
                  root_pubspec = (
                      load_pubspec("pubspec.yaml", strict=True)
                      if root_has_pubspec
                      else None
                  )
                  if root_pubspec is not None and root_pubspec.get("publish_to") != "none":
                      resolved = "."
                  else:
                      m = TAG_RE.match(ref_name)
                      if m:
                          pkg_name = m.group(1)
                          publishable_matches = []
                          unpublished_matches = []
                          for dirpath, dirnames, filenames in os.walk("."):
                              dirnames[:] = [
                                  d for d in sorted(dirnames) if not d.startswith(".")
                              ]
                              if "pubspec.yaml" not in filenames:
                                  continue
                              pubspec_path = os.path.join(dirpath, "pubspec.yaml")
                              pubspec = load_pubspec(pubspec_path, strict=False)
                              if pubspec is None:
                                  continue
                              rel_dir = os.path.normpath(dirpath)
                              if pubspec.get("publish_to") != "none":
                                  if pubspec.get("name") == pkg_name:
                                      publishable_matches.append(rel_dir)
                                  # Published packages do not contain nested published packages.
                                  dirnames[:] = []
                              else:
                                  if pubspec.get("name") == pkg_name:
                                      unpublished_matches.append(rel_dir)

                          if len(publishable_matches) == 1:
                              resolved = publishable_matches[0]
                          elif len(publishable_matches) > 1:
                              sys.exit(
                                  f"Error: Multiple publishable packages named "
                                  f"'{pkg_name}' found: "
                                  f"{', '.join(publishable_matches)}. Specify "
                                  f"'working-directory' explicitly."
                              )
                          elif unpublished_matches:
                              sys.exit(
                                  f"Error: Package '{pkg_name}' at "
                                  f"'{unpublished_matches[0]}' has 'publish_to: none' "
                                  f"and cannot be published."
                              )
                          else:
                              sys.exit(
                                  f"Error: No package named '{pkg_name}' found in "
                                  f"repository for tag '{ref_name}'."
                              )
                      elif root_pubspec is not None and test_run:
                          resolved = "."
                      elif root_pubspec is not None:
                          sys.exit(
                              "Error: Root pubspec.yaml has 'publish_to: none'. "
                              "Use a '<package>-v<version>' tag to publish a "
                              "workspace/monorepo package, or specify "
                              "'working-directory'."
                          )
                      else:
                          sys.exit(
                              f"Error: No root pubspec.yaml found, and ref "
                              f"'{ref_name}' does not match '<package>-v<version>'. "
                              f"Specify 'working-directory' or push a "
                              f"'<package>-v<version>' tag."
                          )

          print(f"Resolved package directory: {resolved}")
          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as out:
                  out.write(f"directory={resolved}\n")
          EOF

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ inputs.sdk }}

      - name: Set up Flutter
        if: ${{ inputs.use-flutter }}
        uses: flutter-actions/setup-flutter@6e2468fd827c4a7337cd4b835a6049b78bc0bd1f

      - name: Install dependencies
        run: dart pub get
        working-directory: ${{ steps.resolve-dir.outputs.directory }}

      - name: Publish - dry run
        run: dart pub publish --dry-run
        working-directory: ${{ steps.resolve-dir.outputs.directory }}

  package:
    name: 'Package archive'
    needs: [validate]
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ inputs.sdk }}

      - name: Package archive for provenance
        env:
          PKG_DIR: ${{ needs.validate.outputs.working-directory }}
        run: |
          sudo -E unshare -n sudo -u "$(whoami)" -E env "PATH=$PATH" "HOME=$HOME" \
            dart pub publish --to-archive="$RUNNER_TEMP/package.tar.gz" --skip-validation --directory="${PKG_DIR:-.}"
          echo "Package archive created at $RUNNER_TEMP/package.tar.gz"

      - name: Upload package archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-archive
          path: ${{ runner.temp }}/package.tar.gz
          if-no-files-found: error
          overwrite: true

  publish:
    name: 'Publish to pub.dev'
    needs: [package]
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write # Required for OIDC token minting
    runs-on: ubuntu-latest
    steps:
      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ inputs.sdk }}

      - name: Download package archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-archive
          path: ${{ runner.temp }}/

      - name: Publish to pub.dev
        if: ${{ !inputs.test-run }}
        run: |
          dart pub publish --from-archive="$RUNNER_TEMP/package.tar.gz" --force

      - name: Verify package archive
        if: ${{ inputs.test-run }}
        run: |
          if [ ! -s "$RUNNER_TEMP/package.tar.gz" ]; then
            echo "Error: $RUNNER_TEMP/package.tar.gz does not exist or is empty."
            exit 1
          fi
          echo "Archive contents:"
          tar -ztvf "$RUNNER_TEMP/package.tar.gz"
          tar -ztf "$RUNNER_TEMP/package.tar.gz" | grep -qx "pubspec.yaml"
          ! tar -ztf "$RUNNER_TEMP/package.tar.gz" | grep -q "^output/"
