name: Publish to pub.dev

## Caller of this workflow should use it as follows:
##
## jobs:
##   publish:
##     permissions:
##       id-token: write # Required for OIDC token minting
##     uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
##     # with:
##     #   # Fixed path (e.g. 'pkgs/my_pkg'), or a pattern using the literal
##     #   # '{package}' placeholder and/or globs for '<package>-v<version>' tags
##     #   # (e.g. 'pkgs/{package}', 'packages/*/{package}', or '**/{package}'):
##     #   working-directory: pkgs/{package}
##     #   sdk: stable
##     #   use-flutter: false

on:
  workflow_call:
    inputs:
      environment:
        description: If specified, the workflow is required to be run in this environment (with additional approvals).
        required: false
        type: string
      working-directory:
        description: >-
          The directory (or glob pattern, such as 'packages/*/{package}' or
          '**/{package}') within the repository where the package is located.
          Supports the literal '{package}' placeholder, which expands '<package>'
          from '<package>-v<version>' release tags (for example,
          'pkgs/{package}').
        required: false
        default: '.'
        type: string
      sdk:
        description: >-
          The Dart SDK channel ('stable', 'beta', 'dev'), release version
          ('3.13'), or specific version ('3.14.0-286.0.dev') to install.
        required: false
        default: 'stable'
        type: string
      use-flutter:
        description: Whether to install the Flutter SDK in addition to the Dart SDK.
        required: false
        default: true
        type: boolean
      test-run:
        description: Whether to verify the package archive instead of publishing to pub.dev.
        required: false
        default: false
        type: boolean

jobs:
  validate:
    name: 'Validate package'
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      working-directory: ${{ steps.resolve-dir.outputs.directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: ${{ inputs.sdk }}

      - name: Resolve package directory
        id: resolve-dir
        env:
          INPUT_DIR: ${{ inputs.working-directory }}
          REF_NAME: ${{ github.ref_name }}
          TEST_RUN: ${{ inputs.test-run }}
        run: |
          cat <<'EOF' > "${RUNNER_TEMP:-/tmp}/resolve_dir.dart"
          import 'dart:io';

          Never fail(String message) {
            stderr.writeln('Error: $message');
            exit(1);
          }

          String? yamlField(File pubspec, String key) {
            final re = RegExp('^$key:\\s*(?:"([^"]*)"|\'([^\']*)\'|([^\\s#]+))');
            for (final line in pubspec.readAsLinesSync()) {
              final m = re.firstMatch(line);
              if (m != null) return m.group(1) ?? m.group(2) ?? m.group(3);
            }
            return null;
          }

          RegExp globToRegExp(String pattern) {
            final buf = StringBuffer('^');
            for (var i = 0; i < pattern.length; i++) {
              if (pattern.startsWith('**/', i)) {
                buf.write('(?:.+/)?');
                i += 2;
              } else if (pattern.startsWith('**', i)) {
                buf.write('.*');
                i += 1;
              } else {
                final c = pattern[i];
                switch (c) {
                  case '*':
                    buf.write('[^/]*');
                  case '?':
                    buf.write('[^/]');
                  case '[':
                    final end = pattern.indexOf(']', i + 1);
                    if (end == -1) {
                      buf.write(r'\[');
                    } else {
                      buf.write(pattern.substring(i, end + 1));
                      i = end;
                    }
                  default:
                    buf.write(RegExp.escape(c));
                }
              }
            }
            buf.write(r'$');
            return RegExp(buf.toString());
          }

          void main() {
            final env = Platform.environment;
            var dir = env['INPUT_DIR'] ?? '.';
            if (dir.isEmpty) dir = '.';
            final refName = env['REF_NAME'] ?? '';
            final testRun = env['TEST_RUN'] == 'true';

            String? pkg;
            if (dir.contains('{package}')) {
              final match =
                  RegExp(r'^([a-z0-9_]+)-v\d+\.\d+\.\d+').firstMatch(refName);
              if (match == null) {
                fail("Cannot expand '{package}' in '$dir': "
                    "ref '$refName' does not match '<package>-v<version>'.");
              }
              pkg = match.group(1)!;
              dir = dir.replaceAll('{package}', pkg);
            }

            if (dir.startsWith('/') || '/$dir/'.contains('/../')) {
              fail("working-directory '$dir' must stay within the repository.");
            }
            dir = dir.replaceAll(RegExp(r'/+$'), '');
            if (dir.isEmpty) dir = '.';

            final isGlob = RegExp(r'[*?\[]').hasMatch(dir);
            final candidates = <String>[];
            if (!isGlob) {
              if (File('$dir/pubspec.yaml').existsSync()) candidates.add(dir);
            } else {
              final globRe = globToRegExp(dir);
              void walk(Directory d, String rel) {
                if (rel.isNotEmpty && File('${d.path}/pubspec.yaml').existsSync()) {
                  if (globRe.hasMatch(rel)) candidates.add(rel);
                  if (yamlField(File('${d.path}/pubspec.yaml'), 'publish_to') !=
                      'none') {
                    return; // Skip nested fixtures inside publishable packages.
                  }
                }
                for (final e in d.listSync(followLinks: false)) {
                  if (e is! Directory) continue;
                  final name = e.uri.pathSegments.where((s) => s.isNotEmpty).last;
                  if (name == '.git' || name == '.dart_tool') continue;
                  walk(e, rel.isEmpty ? name : '$rel/$name');
                }
              }
              walk(Directory.current, '');
              candidates.sort();
            }

            final matches = <String>[];
            String? unpublished;
            String? mismatched;
            for (final cand in candidates) {
              final pubspec = File('$cand/pubspec.yaml');
              if (pkg != null && yamlField(pubspec, 'name') != pkg) {
                mismatched ??= cand;
              } else if ((!testRun || pkg != null || isGlob) &&
                  yamlField(pubspec, 'publish_to') == 'none') {
                unpublished ??= cand;
              } else {
                matches.add(cand);
              }
            }

            if (matches.isEmpty) {
              if (unpublished != null) {
                fail("Package at '$unpublished' has 'publish_to: none' and cannot be published.");
              } else if (mismatched != null) {
                fail("Package name in '$mismatched/pubspec.yaml' "
                    "does not match '$pkg' from tag '$refName'.");
              } else {
                fail("No pubspec.yaml found matching '$dir'.");
              }
            }
            if (matches.length > 1) {
              fail("Pattern '$dir' matched multiple publishable packages: "
                  "${matches.join(' ')}.");
            }

            final resolved = matches.single;
            stdout.writeln('Resolved package directory: $resolved');
            final githubOutput = env['GITHUB_OUTPUT'];
            if (githubOutput != null && githubOutput.isNotEmpty) {
              File(githubOutput)
                  .writeAsStringSync('directory=$resolved\n', mode: FileMode.append);
            }
          }
          EOF
          dart "${RUNNER_TEMP:-/tmp}/resolve_dir.dart"

      - name: Set up Flutter
        if: ${{ inputs.use-flutter }}
        uses: flutter-actions/setup-flutter@6e2468fd827c4a7337cd4b835a6049b78bc0bd1f

      - name: Install dependencies
        run: dart pub get
        working-directory: ${{ steps.resolve-dir.outputs.directory }}

      - name: Publish - dry run
        run: dart pub publish --dry-run
        working-directory: ${{ steps.resolve-dir.outputs.directory }}

  package:
    name: 'Package archive'
    needs: [validate]
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: ${{ inputs.sdk }}

      - name: Package archive for provenance
        env:
          PKG_DIR: ${{ needs.validate.outputs.working-directory }}
        run: |
          sudo -E unshare -n sudo -u "$(whoami)" -E env "PATH=$PATH" "HOME=$HOME" \
            dart pub publish --to-archive="$RUNNER_TEMP/package.tar.gz" --skip-validation --directory="${PKG_DIR:-.}"
          echo "Package archive created at $RUNNER_TEMP/package.tar.gz"

      - name: Upload package archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-archive
          path: ${{ runner.temp }}/package.tar.gz
          if-no-files-found: error
          overwrite: true

  publish:
    name: 'Publish to pub.dev'
    needs: [package]
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write # Required for OIDC token minting
    runs-on: ubuntu-latest
    steps:
      - name: Set up Dart
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: ${{ inputs.sdk }}

      - name: Download package archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-archive
          path: ${{ runner.temp }}/

      - name: Publish to pub.dev
        if: ${{ !inputs.test-run }}
        run: |
          dart pub publish --from-archive="$RUNNER_TEMP/package.tar.gz" --force

      - name: Verify package archive
        if: ${{ inputs.test-run }}
        run: |
          if [ ! -s "$RUNNER_TEMP/package.tar.gz" ]; then
            echo "Error: $RUNNER_TEMP/package.tar.gz does not exist or is empty."
            exit 1
          fi
          echo "Archive contents:"
          tar -ztvf "$RUNNER_TEMP/package.tar.gz"
          tar -ztf "$RUNNER_TEMP/package.tar.gz" | grep -qx "pubspec.yaml"
          ! tar -ztf "$RUNNER_TEMP/package.tar.gz" | grep -q "^output/"
