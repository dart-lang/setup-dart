name: Publish to pub.dev

## Caller of this workflow should use it as follows:
##
## jobs:
##   publish:
##     permissions:
##       id-token: write # Required for OIDC token minting
##       attestations: write # Required for publishing artifact attestations
##       contents: read # Required for actions/checkout
##     uses: dart-lang/setup-dart/.github/workflows/publish.yml@v2
##     # with:
##     #   working-directory: path/to/sub/directory

on:
  workflow_call:
    inputs:
      environment:
        description: If specified, the workflow is required to be run in this environment (with additional approvals).
        required: false
        type: string
      working-directory:
        description: The directory within the repository where the package is located (if not in the repository root).
        required: false
        default: '.'
        type: string
      use-flutter:
        description: Whether to install the Flutter SDK instead of pure Dart SDK.
        required: false
        default: false
        type: boolean
      prebuilt-package-archive:
        description: >-
          The name of the uploaded artifact containing a pre-built package archive (package.tar.gz).
          When specified, the packaging job is skipped and this artifact is used instead.
        required: false
        type: string

jobs:
  package:
    name: 'Package archive'
    if: ${{ !inputs.prebuilt-package-archive }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1

      - name: Set up Flutter
        if: ${{ inputs.use-flutter }}
        uses: flutter-actions/setup-flutter@c7fdb36b173fc3e88e5c5a3733c2b66bd9ac91a1 # v3

      - name: Install dependencies
        run: dart pub get
        working-directory: ${{ inputs.working-directory }}

      - name: Publish - dry run
        run: dart pub publish --dry-run
        working-directory: ${{ inputs.working-directory }}

      - name: Package archive for provenance
        env:
          PKG_DIR: ${{ inputs.working-directory }}
        run: |
          mkdir -p output
          dart pub publish --to-archive="$PWD/output/package.tar.gz" --skip-validation --directory="${PKG_DIR:-.}"
          echo "Package archive created at output/package.tar.gz"

      - name: Upload package archive
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: package-archive
          path: output/package.tar.gz
          if-no-files-found: error

  publish:
    name: 'Publish to pub.dev'
    needs: [package]
    if: always() && !cancelled() && !failure() && (needs.package.result == 'success' || needs.package.result == 'skipped')
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write # Required for OIDC token minting
      attestations: write # Required for publishing artifact attestations
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1

      - name: Download package archive
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.prebuilt-package-archive || 'package-archive' }}
          path: output/

      - name: Generate Build Provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'output/package.tar.gz'

      - name: Upload attestation bundle
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: attestation-bundle
          path: ${{ steps.attest.outputs.bundle-path }}

      - name: Publish to pub.dev
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          dart pub publish --from-archive="output/package.tar.gz" --with-attestation="$ATTESTATION_BUNDLE" --force
