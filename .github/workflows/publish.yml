name: Publish to pub.dev

## Caller of this workflow should use it as follows:
##
## jobs:
##   publish:
##     permissions:
##       id-token: write # Required for OIDC token minting
##       attestations: write # Required for publishing artifact attestations
##     uses: dart-lang/setup-dart/.github/workflows/publish.yml@v2
##     # with:
##     #   working-directory: path/to/sub/directory

on:
  workflow_call:
    inputs:
      environment:
        description: If specified, the workflow is required to be run in this environment (with additional approvals).
        required: false
        type: string
      working-directory:
        description: The directory within the repository where the package is located (if not in the repository root).
        required: false
        default: '.'
        type: string
      sdk:
        description: The SDK version or channel to use.
        required: false
        default: 'stable'
        type: string
      use-flutter:
        description: Whether to install the Flutter SDK instead of pure Dart SDK.
        required: false
        default: false
        type: boolean
      skip-validation:
        description: Whether to skip pre-release validation (dry run).
        required: false
        default: false
        type: boolean
      use-prebuilt-archive:
        description: >-
          Whether to use a pre-built package archive uploaded by the caller workflow
          (named by package-archive-name or defaulting to 'package-archive').
          When true, skips the package job.
        required: false
        default: false
        type: boolean
      package-archive-name:
        description: The name of the uploaded artifact containing the package archive.
        required: false
        default: 'package-archive'
        type: string

jobs:
  package:
    name: 'Package archive'
    if: ${{ !inputs.use-prebuilt-archive }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ inputs.sdk }}

      - name: Set up Flutter
        if: ${{ inputs.use-flutter }}
        uses: flutter-actions/setup-flutter@c7fdb36b173fc3e88e5c5a3733c2b66bd9ac91a1 # v3

      - name: Install dependencies
        run: dart pub get
        working-directory: ${{ inputs.working-directory }}

      - name: Publish - dry run
        if: ${{ !inputs.skip-validation }}
        run: dart pub publish --dry-run
        working-directory: ${{ inputs.working-directory }}

      - name: Package archive for provenance
        env:
          PKG_DIR: ${{ inputs.working-directory }}
        run: |
          mkdir -p output
          dart pub publish --to-archive="$PWD/output/package.tar.gz" --skip-validation -C "${PKG_DIR:-.}"
          echo "Package archive created at output/package.tar.gz"

      - name: Upload package archive
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: ${{ inputs.package-archive-name }}
          path: output/package.tar.gz
          if-no-files-found: error

  publish:
    name: 'Publish to pub.dev'
    needs: [package]
    if: always() && !cancelled() && !failure() && (needs.package.result == 'success' || needs.package.result == 'skipped')
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write # Required for OIDC token minting
      attestations: write # Required for publishing artifact attestations
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ inputs.sdk }}

      - name: Download package archive
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.package-archive-name }}
          path: output/

      - name: Generate Build Provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'output/*.tar.gz'

      - name: Upload attestation bundle
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: attestation-bundle
          path: ${{ steps.attest.outputs.bundle-path }}

      - name: Publish to pub.dev
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          ARCHIVE="output/package.tar.gz"
          if [ ! -f "$ARCHIVE" ]; then
            ARCHIVE=$(find output -name '*.tar.gz' | head -n 1)
          fi
          if [ -z "$ARCHIVE" ] || [ ! -f "$ARCHIVE" ]; then
            echo "::error::No package archive found in output/"
            exit 1
          fi
          echo "Publishing $ARCHIVE with attestation $ATTESTATION_BUNDLE"
          dart pub publish --from-archive="$ARCHIVE" --with-attestation="$ATTESTATION_BUNDLE" -f
