name: Publish to pub.dev

## Caller of this workflow should use it as follows:
##
## jobs:
##   publish:
##     permissions:
##       id-token: write # Required for OIDC token minting
##     uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
##     # with:
##     #   # Fixed path (e.g. 'pkgs/my_pkg'), or a pattern using the literal
##     #   # '{package}' placeholder and/or globs for '<package>-v<version>' tags
##     #   # (e.g. 'pkgs/{package}', 'packages/*/{package}', or '**/{package}'):
##     #   working-directory: pkgs/{package}
##     #   sdk: stable
##     #   use-flutter: false

on:
  workflow_call:
    inputs:
      environment:
        description: If specified, the workflow is required to be run in this environment (with additional approvals).
        required: false
        type: string
      working-directory:
        description: >-
          The directory (or glob pattern, such as 'packages/*/{package}' or
          '**/{package}') within the repository where the package is located.
          Supports the literal '{package}' placeholder, which expands '<package>'
          from '<package>-v<version>' release tags (for example,
          'pkgs/{package}').
        required: false
        default: '.'
        type: string
      sdk:
        description: >-
          The Dart SDK channel ('stable', 'beta', 'dev'), release version
          ('3.13'), or specific version ('3.14.0-286.0.dev') to install.
        required: false
        default: 'stable'
        type: string
      use-flutter:
        description: Whether to install the Flutter SDK in addition to the Dart SDK.
        required: false
        default: true
        type: boolean
      test-run:
        description: Whether to verify the package archive instead of publishing to pub.dev.
        required: false
        default: false
        type: boolean

jobs:
  validate:
    name: 'Validate package'
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      working-directory: ${{ steps.resolve-dir.outputs.directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve package directory
        id: resolve-dir
        env:
          INPUT_DIR: ${{ inputs.working-directory }}
          REF_NAME: ${{ github.ref_name }}
          TEST_RUN: ${{ inputs.test-run }}
        run: |
          shopt -s globstar
          dir="${INPUT_DIR:-.}"
          pkg=""
          placeholder='{package}'
          if [[ "$dir" == *"$placeholder"* ]]; then
            tag_re='^([a-z0-9_]+)-v[0-9]+\.[0-9]+\.[0-9]+'
            if [[ ! "$REF_NAME" =~ $tag_re ]]; then
              echo "Error: Cannot expand '{package}' in '$dir': ref '$REF_NAME' does not match '<package>-v<version>'." >&2
              exit 1
            fi
            pkg="${BASH_REMATCH[1]}"
            dir="${dir//$placeholder/$pkg}"
          fi
          if [[ "$dir" == /* || "/$dir/" == *"/../"* ]]; then
            echo "Error: working-directory '$dir' must stay within the repository." >&2
            exit 1
          fi
          dir="${dir%/}"
          [[ -z "$dir" ]] && dir="."
          is_glob=false
          [[ "$dir" == *[\*\?\[]* ]] && is_glob=true
          mapfile -t candidates < <(compgen -G "$dir" | sort -u || true)
          matches=()
          unpublished=()
          mismatched=()
          for cand in "${candidates[@]}"; do
            [[ -f "$cand/pubspec.yaml" ]] || continue
            if [[ "$is_glob" == true ]]; then
              parent="$(dirname "$cand")"
              nested=false
              while [[ "$parent" != "." && "$parent" != "/" ]]; do
                if [[ -f "$parent/pubspec.yaml" ]] && ! grep -Eq "^publish_to:[[:space:]]*(['\"]none['\"]|none)([[:space:]]*(#.*)?)?$" "$parent/pubspec.yaml"; then
                  nested=true
                  break
                fi
                parent="$(dirname "$parent")"
              done
              [[ "$nested" == true ]] && continue
            fi
            if [[ -n "$pkg" ]] && ! grep -Eq "^name:[[:space:]]*(['\"]${pkg}['\"]|${pkg})([[:space:]]*(#.*)?)?$" "$cand/pubspec.yaml"; then
              mismatched+=("$cand")
              continue
            fi
            if [[ "$TEST_RUN" != "true" || -n "$pkg" || "$is_glob" == true ]] && grep -Eq "^publish_to:[[:space:]]*(['\"]none['\"]|none)([[:space:]]*(#.*)?)?$" "$cand/pubspec.yaml"; then
              unpublished+=("$cand")
              continue
            fi
            matches+=("$cand")
          done
          if (( ${#matches[@]} == 0 )); then
            if (( ${#unpublished[@]} > 0 )); then
              echo "Error: Package at '${unpublished[0]}' has 'publish_to: none' and cannot be published." >&2
            elif (( ${#mismatched[@]} > 0 )); then
              echo "Error: Package name in '${mismatched[0]}/pubspec.yaml' does not match '$pkg' from tag '$REF_NAME'." >&2
            else
              echo "Error: No pubspec.yaml found matching '$dir'." >&2
            fi
            exit 1
          fi
          if (( ${#matches[@]} > 1 )); then
            echo "Error: Pattern '$dir' matched multiple publishable packages: ${matches[*]}." >&2
            exit 1
          fi
          resolved="${matches[0]}"
          echo "Resolved package directory: $resolved"
          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            echo "directory=$resolved" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Dart
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: ${{ inputs.sdk }}

      - name: Set up Flutter
        if: ${{ inputs.use-flutter }}
        uses: flutter-actions/setup-flutter@6e2468fd827c4a7337cd4b835a6049b78bc0bd1f

      - name: Install dependencies
        run: dart pub get
        working-directory: ${{ steps.resolve-dir.outputs.directory }}

      - name: Publish - dry run
        run: dart pub publish --dry-run
        working-directory: ${{ steps.resolve-dir.outputs.directory }}

  package:
    name: 'Package archive'
    needs: [validate]
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: ${{ inputs.sdk }}

      - name: Package archive for provenance
        env:
          PKG_DIR: ${{ needs.validate.outputs.working-directory }}
        run: |
          sudo -E unshare -n sudo -u "$(whoami)" -E env "PATH=$PATH" "HOME=$HOME" \
            dart pub publish --to-archive="$RUNNER_TEMP/package.tar.gz" --skip-validation --directory="${PKG_DIR:-.}"
          echo "Package archive created at $RUNNER_TEMP/package.tar.gz"

      - name: Upload package archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-archive
          path: ${{ runner.temp }}/package.tar.gz
          if-no-files-found: error
          overwrite: true

  publish:
    name: 'Publish to pub.dev'
    needs: [package]
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write # Required for OIDC token minting
    runs-on: ubuntu-latest
    steps:
      - name: Set up Dart
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: ${{ inputs.sdk }}

      - name: Download package archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-archive
          path: ${{ runner.temp }}/

      - name: Publish to pub.dev
        if: ${{ !inputs.test-run }}
        run: |
          dart pub publish --from-archive="$RUNNER_TEMP/package.tar.gz" --force

      - name: Verify package archive
        if: ${{ inputs.test-run }}
        run: |
          if [ ! -s "$RUNNER_TEMP/package.tar.gz" ]; then
            echo "Error: $RUNNER_TEMP/package.tar.gz does not exist or is empty."
            exit 1
          fi
          echo "Archive contents:"
          tar -ztvf "$RUNNER_TEMP/package.tar.gz"
          tar -ztf "$RUNNER_TEMP/package.tar.gz" | grep -qx "pubspec.yaml"
          ! tar -ztf "$RUNNER_TEMP/package.tar.gz" | grep -q "^output/"
