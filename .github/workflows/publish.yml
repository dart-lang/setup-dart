name: Publish to pub.dev

## Caller of this workflow should use it as follows:
##
## jobs:
##   publish:
##     permissions:
##       id-token: write # Required for OIDC token minting
##       attestations: write # Required for publishing artifact attestations
##     uses: dart-lang/setup-dart/.github/workflows/publish.yml@v2
##     # with:
##     #   working-directory: path/to/sub/directory

on:
  workflow_call:
    inputs:
      environment:
        description: If specified, the workflow is required to be run in this environment (with additional approvals).
        required: false
        type: string
      working-directory:
        description: >-
          The directory within the repository where the package is located (if not in the repository root).
          If omitted, the workflow attempts to locate the package directory based on the git tag
          (e.g. 'package_name-v1.2.3' in 'pkgs/package_name' or 'packages/package_name') or defaults to the root.
        required: false
        type: string
      sdk:
        description: The SDK version or channel to use.
        required: false
        default: 'stable'
        type: string
      use-flutter:
        description: Whether to install the Flutter SDK instead of pure Dart SDK.
        required: false
        default: false
        type: boolean
      skip-validation:
        description: Whether to skip pre-release validation (dry run).
        required: false
        default: false
        type: boolean
      use-prebuilt-archive:
        description: >-
          Whether to use a pre-built package archive uploaded by the caller workflow
          (named by package-archive-name or defaulting to 'package-archive').
          When true, skips the package job.
        required: false
        default: false
        type: boolean
      package-archive-name:
        description: The name of the uploaded artifact containing the package archive.
        required: false
        default: 'package-archive'
        type: string

jobs:
  package:
    name: 'Package archive'
    if: ${{ !inputs.use-prebuilt-archive }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1
        with:
          sdk: ${{ inputs.sdk }}

      - name: Set up Flutter
        if: ${{ inputs.use-flutter }}
        uses: flutter-actions/setup-flutter@6e2468fd827c4a7337cd4b835a6049b78bc0bd1f # v3

      - name: Resolve package directory
        id: resolve-pkg
        env:
          INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          TAG_REF: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_WORKING_DIRECTORY" ]; then
            PKG_DIR="$INPUT_WORKING_DIRECTORY"
          elif [[ "$TAG_REF" =~ ^(.*)-v([0-9].*)$ ]]; then
            TAG_PKG="${BASH_REMATCH[1]}"
            if [ -f "pkgs/$TAG_PKG/pubspec.yaml" ]; then
              PKG_DIR="pkgs/$TAG_PKG"
            elif [ -f "packages/$TAG_PKG/pubspec.yaml" ]; then
              PKG_DIR="packages/$TAG_PKG"
            elif [ -f "./pubspec.yaml" ] && grep -q "^name: *$TAG_PKG$" "./pubspec.yaml"; then
              PKG_DIR="."
            else
              PKG_DIR=$(find . -name pubspec.yaml -not -path '*/.*' -exec grep -l "^name: *$TAG_PKG$" {} + | head -n 1 | xargs -r dirname)
              PKG_DIR="${PKG_DIR:-.}"
            fi
          else
            PKG_DIR="."
          fi

          if [ ! -f "$PKG_DIR/pubspec.yaml" ]; then
            echo "::error::pubspec.yaml not found in directory '$PKG_DIR'"
            exit 1
          fi

          PKG_NAME=$(grep '^name:' "$PKG_DIR/pubspec.yaml" | head -n 1 | awk '{print $2}' | tr -d '\r"')
          PKG_VERSION=$(grep '^version:' "$PKG_DIR/pubspec.yaml" | head -n 1 | awk '{print $2}' | tr -d '\r"')

          echo "Target package: $PKG_NAME version $PKG_VERSION in directory $PKG_DIR"
          echo "pkg-dir=$PKG_DIR" >> "$GITHUB_OUTPUT"
          echo "pkg-name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "pkg-version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: dart pub get
        working-directory: ${{ steps.resolve-pkg.outputs.pkg-dir }}

      - name: Publish - dry run
        if: ${{ !inputs.skip-validation }}
        run: dart pub publish --dry-run
        working-directory: ${{ steps.resolve-pkg.outputs.pkg-dir }}

      - name: Package archive for provenance
        env:
          PKG_DIR: ${{ steps.resolve-pkg.outputs.pkg-dir }}
          PKG_NAME: ${{ steps.resolve-pkg.outputs.pkg-name }}
          PKG_VERSION: ${{ steps.resolve-pkg.outputs.pkg-version }}
        run: |
          mkdir -p output
          ARCHIVE="output/${PKG_NAME}-${PKG_VERSION}.tar.gz"
          # Run hermetically without network access when unshare is supported
          if command -v unshare >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo -E unshare -n sudo -u $(whoami) -E env "PATH=$PATH" "HOME=$HOME" dart pub publish --to-archive="$PWD/$ARCHIVE" --skip-validation -C "$PKG_DIR"
          else
            dart pub publish --to-archive="$PWD/$ARCHIVE" --skip-validation -C "$PKG_DIR"
          fi
          echo "Package archive created at $ARCHIVE"

      - name: Upload package archive
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: ${{ inputs.package-archive-name }}
          path: output/*.tar.gz
          if-no-files-found: error

  publish:
    name: 'Publish to pub.dev'
    needs: [package]
    if: always() && !cancelled() && !failure() && (needs.package.result == 'success' || needs.package.result == 'skipped')
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write # Required for OIDC token minting
      attestations: write # Required for publishing artifact attestations
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1
        with:
          sdk: ${{ inputs.sdk }}

      - name: Download package archive
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.package-archive-name }}
          path: output/

      - name: Generate Build Provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'output/*.tar.gz'

      - name: Upload attestation bundle
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: attestation-bundle
          path: ${{ steps.attest.outputs.bundle-path }}

      - name: Publish to pub.dev
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          ARCHIVE=$(find output -name '*.tar.gz' | head -n 1)
          if [ -z "$ARCHIVE" ] || [ ! -f "$ARCHIVE" ]; then
            echo "::error::No package archive found in output/"
            exit 1
          fi
          echo "Publishing $ARCHIVE with attestation $ATTESTATION_BUNDLE"
          if ! dart pub publish --from-archive="$ARCHIVE" --with-attestation="$ATTESTATION_BUNDLE" -f 2>output/err.log; then
            if grep -q 'Could not find an option named "--with-attestation"' output/err.log; then
              echo "::warning::'--with-attestation' is not yet supported in this Dart SDK. Publishing from archive without attestation."
              dart pub publish --from-archive="$ARCHIVE" -f
            else
              cat output/err.log >&2
              exit 1
            fi
          fi
