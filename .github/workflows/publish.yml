name: Publish to pub.dev

## Caller of this workflow should use it as follows:
##
## jobs:
##   publish:
##     permissions:
##       id-token: write # Required for OIDC token minting
##       # attestations: write # Required if `attest: true`
##     uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
##     # with:
##     #   working-directory: path/to/sub/directory
##     #   sdk: stable
##     #   use-flutter: false
##     #   attest: true
##     #   bundled-files: |
##     #     prebuilt/linux-x64/libfoo.so

on:
  workflow_call:
    inputs:
      environment:
        description: If specified, the workflow is required to be run in this environment (with additional approvals).
        required: false
        type: string
      working-directory:
        description: The directory within the repository where the package is located (if not in the repository root).
        required: false
        default: '.'
        type: string
      sdk:
        description: >-
          The Dart SDK channel ('stable', 'beta', 'dev'), release version
          ('3.13'), or specific version ('3.14.0-286.0.dev') to install.
        required: false
        default: 'stable'
        type: string
      use-flutter:
        description: Whether to install the Flutter SDK in addition to the Dart SDK.
        required: false
        default: true
        type: boolean
      attest:
        description: >-
          Whether to generate a Sigstore build provenance attestation for the
          package archive (using `actions/attest`). The calling job must grant
          `attestations: write` in addition to `id-token: write`.
        required: false
        default: false
        type: boolean
      bundled-files:
        description: >-
          Newline-separated list of package-relative file paths (not tracked in
          git) to copy into `working-directory` from `bundled-files-*` workflow
          artifacts uploaded by preceding jobs in the same workflow run. Fails
          if any listed file is missing, if any unlisted or duplicate file was
          uploaded, if a path escapes `working-directory` or overwrites a
          git-tracked file, or if a listed file is excluded from the resulting
          package archive.
        required: false
        default: ''
        type: string
      test-run:
        description: Whether to verify the package archive instead of publishing to pub.dev.
        required: false
        default: false
        type: boolean

jobs:
  validate:
    name: 'Validate package'
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download bundled files
        if: ${{ inputs.bundled-files != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundled-files-*
          path: ${{ runner.temp }}/bundled-files
          merge-multiple: false

      - name: Stage bundled files
        if: ${{ inputs.bundled-files != '' }}
        env:
          PKG_DIR: ${{ inputs.working-directory }}
          BUNDLED_FILES: ${{ inputs.bundled-files }}
          DOWNLOAD_DIR: ${{ runner.temp }}/bundled-files
        run: |
          python3 - << 'EOF'
          import os, pathlib, shutil, subprocess, sys

          pkg_dir = pathlib.Path(os.environ.get('PKG_DIR') or '.').resolve()
          download_dir = pathlib.Path(os.environ['DOWNLOAD_DIR'])
          expected = {}
          for raw in os.environ['BUNDLED_FILES'].splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              rel = pathlib.PurePosixPath(line)
              if rel.is_absolute() or '..' in rel.parts or rel.parts == ():
                  sys.exit(f'::error::Invalid bundled-files path: {line!r}')
              norm = rel.as_posix()
              if norm in expected:
                  sys.exit(f'::error::Duplicate entry in bundled-files: {norm}')
              dest = (pkg_dir / norm).resolve()
              if pkg_dir not in dest.parents:
                  sys.exit(f'::error::Bundled file path escapes working-directory: {line!r}')
              expected[norm] = dest

          if not expected:
              sys.exit('::error::bundled-files was non-empty but listed no file paths.')

          tracked_out = subprocess.check_output(
              ['git', '-C', str(pkg_dir), 'ls-files', '-z'],
          ).decode('utf-8')
          tracked = {p for p in tracked_out.split('\0') if p}
          overwritten = sorted(set(expected) & tracked)
          if overwritten:
              sys.exit(
                  f'::error::bundled-files may not overwrite git-tracked files: '
                  f'{", ".join(overwritten)}'
              )

          if not download_dir.is_dir():
              sys.exit('::error::No bundled-files-* artifacts were found.')

          actual = {}
          for artifact_dir in sorted(download_dir.iterdir()):
              if not artifact_dir.is_dir():
                  sys.exit(f'::error::Unexpected entry in artifact directory: {artifact_dir.name}')
              for root, dirs, files in os.walk(artifact_dir, followlinks=False):
                  root_path = pathlib.Path(root)
                  for d in dirs:
                      if (root_path / d).is_symlink():
                          sys.exit(f'::error::Symlink directory not allowed in {artifact_dir.name}: {d}')
                  for f in files:
                      src = root_path / f
                      if src.is_symlink() or not src.is_file():
                          sys.exit(f'::error::Non-regular file not allowed in {artifact_dir.name}: {f}')
                      rel = src.relative_to(artifact_dir).as_posix()
                      if rel in actual:
                          prev_artifact, _ = actual[rel]
                          sys.exit(
                              f'::error::Duplicate bundled file {rel!r} across artifacts '
                              f'{prev_artifact!r} and {artifact_dir.name!r}.'
                          )
                      actual[rel] = (artifact_dir.name, src)

          extra = sorted(set(actual) - set(expected))
          missing = sorted(set(expected) - set(actual))
          if extra:
              sys.exit(f'::error::Unexpected files in bundled-files-* artifacts: {", ".join(extra)}')
          if missing:
              sys.exit(f'::error::Missing expected bundled files: {", ".join(missing)}')

          for rel, dest in sorted(expected.items()):
              if dest.exists() or dest.is_symlink():
                  sys.exit(f'::error::Bundled file already exists in checkout: {rel}')
              cur = dest.parent
              while cur != pkg_dir:
                  if cur.is_symlink():
                      sys.exit(f'::error::Symlink parent directory not allowed: {cur}')
                  cur = cur.parent
              dest.parent.mkdir(parents=True, exist_ok=True)
              _, src = actual[rel]
              shutil.copy2(src, dest)
              print(f'Staged {rel} ({src.stat().st_size} bytes)')
          EOF

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ inputs.sdk }}

      - name: Set up Flutter
        if: ${{ inputs.use-flutter }}
        uses: flutter-actions/setup-flutter@6e2468fd827c4a7337cd4b835a6049b78bc0bd1f

      - name: Install dependencies
        run: dart pub get
        working-directory: ${{ inputs.working-directory }}

      - name: Publish - dry run
        run: dart pub publish --dry-run
        working-directory: ${{ inputs.working-directory }}

  package:
    name: 'Package archive'
    needs: [validate]
    permissions: {}
    runs-on: ubuntu-latest
    # Job outputs are isolated per job in the Actions control plane, whereas
    # workflow artifacts share `ACTIONS_RUNTIME_TOKEN` across all jobs in the
    # run. Passing the archive digest here prevents a sibling job in the caller
    # workflow from replacing `package-archive` before `attest` or `publish`.
    outputs:
      archive-sha256: ${{ steps.package.outputs.archive-sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download bundled files
        if: ${{ inputs.bundled-files != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundled-files-*
          path: ${{ runner.temp }}/bundled-files
          merge-multiple: false

      - name: Stage bundled files
        if: ${{ inputs.bundled-files != '' }}
        env:
          PKG_DIR: ${{ inputs.working-directory }}
          BUNDLED_FILES: ${{ inputs.bundled-files }}
          DOWNLOAD_DIR: ${{ runner.temp }}/bundled-files
        run: |
          python3 - << 'EOF'
          import os, pathlib, shutil, subprocess, sys

          pkg_dir = pathlib.Path(os.environ.get('PKG_DIR') or '.').resolve()
          download_dir = pathlib.Path(os.environ['DOWNLOAD_DIR'])
          expected = {}
          for raw in os.environ['BUNDLED_FILES'].splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              rel = pathlib.PurePosixPath(line)
              if rel.is_absolute() or '..' in rel.parts or rel.parts == ():
                  sys.exit(f'::error::Invalid bundled-files path: {line!r}')
              norm = rel.as_posix()
              if norm in expected:
                  sys.exit(f'::error::Duplicate entry in bundled-files: {norm}')
              dest = (pkg_dir / norm).resolve()
              if pkg_dir not in dest.parents:
                  sys.exit(f'::error::Bundled file path escapes working-directory: {line!r}')
              expected[norm] = dest

          if not expected:
              sys.exit('::error::bundled-files was non-empty but listed no file paths.')

          tracked_out = subprocess.check_output(
              ['git', '-C', str(pkg_dir), 'ls-files', '-z'],
          ).decode('utf-8')
          tracked = {p for p in tracked_out.split('\0') if p}
          overwritten = sorted(set(expected) & tracked)
          if overwritten:
              sys.exit(
                  f'::error::bundled-files may not overwrite git-tracked files: '
                  f'{", ".join(overwritten)}'
              )

          if not download_dir.is_dir():
              sys.exit('::error::No bundled-files-* artifacts were found.')

          actual = {}
          for artifact_dir in sorted(download_dir.iterdir()):
              if not artifact_dir.is_dir():
                  sys.exit(f'::error::Unexpected entry in artifact directory: {artifact_dir.name}')
              for root, dirs, files in os.walk(artifact_dir, followlinks=False):
                  root_path = pathlib.Path(root)
                  for d in dirs:
                      if (root_path / d).is_symlink():
                          sys.exit(f'::error::Symlink directory not allowed in {artifact_dir.name}: {d}')
                  for f in files:
                      src = root_path / f
                      if src.is_symlink() or not src.is_file():
                          sys.exit(f'::error::Non-regular file not allowed in {artifact_dir.name}: {f}')
                      rel = src.relative_to(artifact_dir).as_posix()
                      if rel in actual:
                          prev_artifact, _ = actual[rel]
                          sys.exit(
                              f'::error::Duplicate bundled file {rel!r} across artifacts '
                              f'{prev_artifact!r} and {artifact_dir.name!r}.'
                          )
                      actual[rel] = (artifact_dir.name, src)

          extra = sorted(set(actual) - set(expected))
          missing = sorted(set(expected) - set(actual))
          if extra:
              sys.exit(f'::error::Unexpected files in bundled-files-* artifacts: {", ".join(extra)}')
          if missing:
              sys.exit(f'::error::Missing expected bundled files: {", ".join(missing)}')

          for rel, dest in sorted(expected.items()):
              if dest.exists() or dest.is_symlink():
                  sys.exit(f'::error::Bundled file already exists in checkout: {rel}')
              cur = dest.parent
              while cur != pkg_dir:
                  if cur.is_symlink():
                      sys.exit(f'::error::Symlink parent directory not allowed: {cur}')
                  cur = cur.parent
              dest.parent.mkdir(parents=True, exist_ok=True)
              _, src = actual[rel]
              shutil.copy2(src, dest)
              print(f'Staged {rel} ({src.stat().st_size} bytes)')
          EOF

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ inputs.sdk }}

      - name: Package archive for provenance
        id: package
        env:
          PKG_DIR: ${{ inputs.working-directory }}
          BUNDLED_FILES: ${{ inputs.bundled-files }}
        run: |
          sudo -E unshare -n sudo -u "$(whoami)" -E env "PATH=$PATH" "HOME=$HOME" \
            dart pub publish --to-archive="$RUNNER_TEMP/package.tar.gz" --skip-validation --directory="${PKG_DIR:-.}"
          if [ -n "${BUNDLED_FILES:-}" ]; then
            python3 - << 'EOF'
          import os, pathlib, subprocess, sys
          archived = set(
              subprocess.check_output(
                  ['tar', '-ztf', os.path.join(os.environ['RUNNER_TEMP'], 'package.tar.gz')],
              ).decode('utf-8').splitlines()
          )
          missing = [
              pathlib.PurePosixPath(line.strip()).as_posix()
              for line in os.environ['BUNDLED_FILES'].splitlines()
              if line.strip() and not line.strip().startswith('#')
              and pathlib.PurePosixPath(line.strip()).as_posix() not in archived
          ]
          if missing:
              sys.exit(
                  f'::error::Bundled files were excluded from package.tar.gz '
                  f'(check .gitignore / .pubignore): {", ".join(missing)}'
              )
          EOF
          fi
          sha256="$(sha256sum < "$RUNNER_TEMP/package.tar.gz" | cut -d' ' -f1)"
          echo "archive-sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Package archive created at $RUNNER_TEMP/package.tar.gz (sha256: $sha256)"

      - name: Upload package archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-archive
          path: ${{ runner.temp }}/package.tar.gz
          if-no-files-found: error
          overwrite: true

  attest:
    name: 'Attest package archive'
    needs: [package]
    if: ${{ inputs.attest }}
    # No `permissions:` block on purpose: this job inherits the permissions of
    # the calling job. GitHub checks the permissions requested by every job of a
    # reusable workflow against those of the caller (even for jobs that would be
    # skipped), so requesting `attestations: write` here would break all
    # existing callers that only grant `id-token: write`. Callers that set
    # `attest: true` must grant `id-token: write` and `attestations: write`.
    runs-on: ubuntu-latest
    steps:
      - name: Download package archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-archive
          path: ${{ runner.temp }}/

      - name: Verify package archive digest
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.archive-sha256 }}
        run: |
          actual="$(sha256sum < "$RUNNER_TEMP/package.tar.gz" | cut -d' ' -f1)"
          if [ -z "$EXPECTED_SHA256" ] || [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::Downloaded package.tar.gz sha256 ($actual) does not match package job output ($EXPECTED_SHA256)."
            exit 1
          fi

      - name: Generate build provenance attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/package.tar.gz

      - name: Stage attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "$RUNNER_TEMP/package.tar.gz.sigstore.json"

      - name: Upload attestation bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestation-bundle
          path: ${{ runner.temp }}/package.tar.gz.sigstore.json
          if-no-files-found: error
          overwrite: true

  publish:
    name: 'Publish to pub.dev'
    needs: [package, attest]
    # Also publish when `attest` was skipped (i.e. `attest: false`).
    if: >-
      ${{ !cancelled() && needs.package.result == 'success' &&
      (needs.attest.result == 'success' || needs.attest.result == 'skipped') }}
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write # Required for OIDC token minting
    runs-on: ubuntu-latest
    steps:
      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ inputs.sdk }}

      - name: Download package archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-archive
          path: ${{ runner.temp }}/

      - name: Verify package archive digest
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.archive-sha256 }}
        run: |
          actual="$(sha256sum < "$RUNNER_TEMP/package.tar.gz" | cut -d' ' -f1)"
          if [ -z "$EXPECTED_SHA256" ] || [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::Downloaded package.tar.gz sha256 ($actual) does not match package job output ($EXPECTED_SHA256)."
            exit 1
          fi

      - name: Publish to pub.dev
        if: ${{ !inputs.test-run }}
        run: |
          dart pub publish --from-archive="$RUNNER_TEMP/package.tar.gz" --force

      - name: Verify package archive
        if: ${{ inputs.test-run }}
        run: |
          if [ ! -s "$RUNNER_TEMP/package.tar.gz" ]; then
            echo "Error: $RUNNER_TEMP/package.tar.gz does not exist or is empty."
            exit 1
          fi
          echo "Archive contents:"
          tar -ztvf "$RUNNER_TEMP/package.tar.gz"
          tar -ztf "$RUNNER_TEMP/package.tar.gz" | grep -qx "pubspec.yaml"
          ! tar -ztf "$RUNNER_TEMP/package.tar.gz" | grep -q "^output/"
